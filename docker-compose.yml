services:
  # Service 1: The Brain (Ollama LLM)
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ./ollama_data:/root/.ollama
    # Ports removed for security (Inquiry 2.3)
    expose:
      - "11434"
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "988"
    environment:
      - OLLAMA_VULKAN=1
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q4_0
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Service 2: The Voice (Kokoro TTS API)
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    expose:
      - "8880"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Service 4: The Companion (Go CNS)
  companion:
    build:
      context: .
    depends_on:
      ollama:
        condition: service_healthy
      kokoro:
        condition: service_healthy
    ports:
      - "8080:8080"
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "988"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - KOKORO_HOST=http://kokoro:8880
      - PULSE_SERVER=unix:${XDG_RUNTIME_DIR}/pulse/native
      - PULSE_COOKIE=/run/user/${UID:-1000}/pulse/cookie
      - MITSU_LANG=${MITSU_LANG:-en}
      - GGML_VULKAN_DEVICE=0
    volumes:
      - ${XDG_RUNTIME_DIR}/pulse/native:${XDG_RUNTIME_DIR}/pulse/native
      - ${HOME}/.config/pulse/cookie:/run/user/${UID:-1000}/pulse/cookie
      - ./voice_config.json:/app/voice_config.json
    user: "${UID:-1000}:${GID:-1000}"
    command: ["sh", "-c", "./companion -lang=${MITSU_LANG}"]
